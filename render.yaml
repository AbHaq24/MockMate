# ==============================================================================
# Render Blueprint Specification for MockMate
# https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  - name: mockmate-postgres
    databaseName: mockmate_db
    user: mockmate
    plan: free
    region: oregon
    ipAllowList: [] # Allow internal Render service connections

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: mockmate-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    # preDeployCommand: alembic upgrade head # Note: preDeployCommand requires a paid plan on Render. For plan: free, migrations run in buildCommand.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mockmate-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false # Configured securely via Render Dashboard (Secret)
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a secure random 256-bit string
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://mockmate-frontend.onrender.com,http://localhost:8501

  # ----------------------------------------------------------------------------
  # 2. Streamlit Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: mockmate-frontend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: MOCKMATE_API_URL
        value: https://mockmate-backend.onrender.com
