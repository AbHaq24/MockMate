services:
  db:
    image: postgres:16-alpine
    container_name: mockmate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mockmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mockmate_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mockmate_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mockmate} -d ${POSTGRES_DB:-mockmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mockmate-network

  backend:
    build:
      context: .
      target: backend
    container_name: mockmate-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mockmate}:${POSTGRES_PASSWORD:-mockmate_dev_secret}@db:5432/${POSTGRES_DB:-mockmate_db}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_change_in_production_min_32_chars}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501,http://frontend:8501
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mockmate-network

  frontend:
    build:
      context: .
      target: frontend
    container_name: mockmate-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MOCKMATE_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mockmate-network

volumes:
  postgres_data:
    name: mockmate_postgres_data

networks:
  mockmate-network:
    name: mockmate_network
    driver: bridge
